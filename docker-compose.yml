x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

# Local development services. The API and web run on the host with `bun run dev`.
# Defaults match apps/api/.env.example, so no extra .env file is needed.
services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sava_drilling}
    ports:
      # Bound to localhost only, so the dev database is not reachable from the network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep data in a versioned folder under /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sava_drilling}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3001
      # Inside the compose network the database host is the service name, not localhost.
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sava_drilling}
      # The browser origin of the web app, allowed by CORS.
      WEB_ORIGIN: http://localhost:${WEB_HOST_PORT:-3000}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Address of the API as the browser sees it (not the compose service name).
        NEXT_PUBLIC_API_URL: http://localhost:${API_HOST_PORT:-3001}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      - api
    logging: *logging

volumes:
  postgres-data:
